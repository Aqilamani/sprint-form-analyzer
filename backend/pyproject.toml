[project]
name = "sprint-form-analyzer-backend"
version = "0.1.0"
description = "API for Sprint Form Analyzer: serves processed sprint runs."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162",
    "uvicorn[standard]>=0.54",
    "pydantic>=2.14",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest",
    "ruff",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
